# 主力签到 — 每天北京时间 08:10 执行
name: "主力签到 08:10"

on:
  schedule:
    - cron: "10 0 * * *"   # UTC 00:10 = 北京时间 08:10
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 主力签到
        env:
          SKLAND_CONFIG: ${{ secrets.SKLAND_CONFIG }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python main.py --mode full

      - name: 上传签到状态
        uses: actions/upload-artifact@v4
        with:
          name: checkin-state
          path: .checkin_state.json
          retention-days: 1
