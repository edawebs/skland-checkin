# 看门狗 — 每天北京时间 12:10 执行
name: "看门狗 12:10"

on:
  schedule:
    - cron: "10 4 * * *"   # UTC 04:10 = 北京时间 12:10
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 看门狗检查
        env:
          SKLAND_CONFIG: ${{ secrets.SKLAND_CONFIG }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python main.py --mode check
