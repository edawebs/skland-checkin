# 看门狗 — 每天北京时间 12:10 执行
name: "看门狗 12:10"

on:
  schedule:
    - cron: "10 4 * * *"   # UTC 04:10 = 北京时间 12:10
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      # download-artifact@v4 默认只下载"当前 run"的 artifact，
      # 必须显式指定 run-id 才能拿到主力签到(08:20)上传的状态文件
      - name: 获取最近一次主力签到 run_id
        id: last-checkin-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/checkin.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].id')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "查到的 run_id: $RUN_ID"

      - name: 下载上午签到状态
        uses: actions/download-artifact@v4
        with:
          name: checkin-state
          run-id: ${{ steps.last-checkin-run.outputs.run_id }}
          github-token: ${{ github.token }}   # 跨 run 下载必须显式传 token，否则只找当前 run
        continue-on-error: true   # 主力签到未运行/上传失败时，看门狗会走"零签到"告警分支

      - name: 看门狗检查
        env:
          SKLAND_CONFIG: ${{ secrets.SKLAND_CONFIG }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python main.py --mode check
